<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Gusarski | 404</title>
        <link rel="shortcut icon" href="assets/images/favicon.png" type="image/png">
        <link rel="stylesheet" href="assets/styles/themes.css">
        <script>document.documentElement.className = localStorage.getItem('themeKey');</script>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: var(--font);
                text-transform: var(--text-transform);
                background: var(--background);
                color: var(--text);
                min-height: 100dvh;
                cursor: pointer;
                padding: 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                user-select: none;
                -webkit-user-drag: none;

                &::before {
                    content: '';
                    position: fixed;
                    top: 0;
                    left: 0;
                    right: 0;
                    bottom: 0;
                    background: var(--background-design);
                    pointer-events: none;
                    z-index: -1;
                }

                .big {
                    font-size: 50px;
                    color: var(--text);
                }

                .small {
                    font-size: 14px;
                    color: var(--text-semi);
                }
            }
        </style>
    </head>
    <body onclick="window.location.href='/'">
        <p class="big">404</p>
        <p class="small">Click anywhere to return</p>
    </body>
</html>
