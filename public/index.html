<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Gusarski</title>
        <link rel="shortcut icon" href="favicon.png" type="image/png">
        <link rel="stylesheet" href="themes.css">
        <link rel="stylesheet" href="style.css">
        <script type="module" src="client.js"></script>
    </head>
    <body>
        <header>
            <img class="logo" src="favicon.png" alt="Logo">
            <button class="sidebarToggle" onclick="toggleSidebar()" title="Toggle Sidebar (/)">

                    <path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/>
                </svg>
            </button>
        </header>

            <div class="queueHeader">
                <h2>Downloads</h2>
            </div>
            <div id="queueList"></div>
            <div id="settings">
                <button id="cycleThemeButton" title="Cycle Theme (m)">

                        <path d="M8.75 7.2a1.5 1.5 0 1 0 .55 2.05 1.5 1.5 0 0 0-.55-2.05z"/>
                        <path d="M6.16 11.26a1.5 1.5 0 1 0 2.08.4 1.49 1.49 0 0 0-2.08-.4z"/>
                    </svg>
                </button>
                <button id="creditsButton" disabled title="Credits (none)">
                    <svg viewBox="0 0 24 24">
                        <path d="M11 15H13V17H11z"></path>

                    </svg>
                </button>
                <button id="shortcutsButton" disabled title="Shortcuts (none)">
                    <svg viewBox="0 0 24 24">
                        <path d="m21,4H3c-1.1,0-2,.9-2,2v12c0,1.1.9,2,2,2h18c1.1,0,2-.9,2-2V6c0-1.1-.9-2-2-2ZM3,18V6h18v12s-18,0-18,0Z"></path>

                        <path d="M8 8H10V10H8z"></path>
                        <path d="M11 8H13V10H11z"></path>
                        <path d="M14 8H16V10H14z"></path>
                        <path d="M17 8H19V10H17z"></path>
                        <path d="M5 11H7V13H5z"></path>
                        <path d="M8 11H10V13H8z"></path>
                        <path d="M8 14H16V16H8z"></path>
                        <path d="M11 11H13V13H11z"></path>
                        <path d="M14 11H16V13H14z"></path>
                        <path d="M17 11H19V13H17z"></path>
                    </svg>
                </button>
            </div>
        </div>
        <main>
            <div class="searchArea">
                <svg id="searchIcon" viewBox="0 0 24 24" fill="none">
                    <path
                        d="M15.7955 15.8111L21 21M18 10.5C18 14.6421 14.6421 18 10.5 18C6.35786 18 3 14.6421 3 10.5C3 6.35786 6.35786 3 10.5 3C14.6421 3 18 6.35786 18 10.5Z"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
                <input
                    type="text"
                    id="searchQuery"
                    placeholder="Search..."
                    onkeyup="if(event.key==='Enter') search()"
                >
                <button id="providerButton" title="Choose Provider (, and . to quick switch)">
                    <img id="currentProviderIcon">
                </button>
            </div>
            <div id="providerPicker"></div>
            <div id="searchResults">
                <div id="results" class="cardContainer"></div>
                <div id="emptyMessage" class="centerMessage">Nothing here yet (；′⌒`)</div>
            </div>
        </main>
        <div id="toastContainer"></div>
        <svg
            id="wsIcon"
            width="35px"
            height="35px"
            viewBox="0 -31.5 256 256"
            preserveAspectRatio="xMidYMid"
        >
            <g>
                <path d="M192.440223,144.644612 L224.220111,144.644612 L224.220111,68.3393384 L188.415329,32.5345562 L165.943007,55.0068785 L192.440223,81.5040943 L192.440223,144.644612 L192.440223,144.644612 Z M224.303963,160.576482 L178.017688,160.576482 L113.451687,160.576482 L86.954471,134.079266 L98.1906322,122.843105 L120.075991,144.728464 L165.104487,144.728464 L120.746806,100.286931 L132.06682,88.9669178 L176.4245,133.324599 L176.4245,88.2961022 L154.622994,66.4945955 L165.775303,55.3422863 L110.684573,0 L56.3485097,0 L56.3485097,0 L0,0 L31.6960367,31.6960367 L31.6960367,31.7798886 L31.8637406,31.7798886 L97.4359646,31.7798886 L120.662954,55.0068785 L86.7029152,88.9669178 L63.4759253,65.7399279 L63.4759253,47.7117589 L31.6960367,47.7117589 L31.6960367,78.9046839 L86.7029152,133.911562 L64.3144448,156.300033 L100.119227,192.104815 L154.45529,192.104815 L256,192.104815 L256,192.104815 L224.303963,160.576482 L224.303963,160.576482 Z"></path>
